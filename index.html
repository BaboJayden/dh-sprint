<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <meta name="description" content="헤스 법칙과 반응 엔탈피 계산 속도를 훈련하는 미니멀 연습 도구" />
  <title>ΔH Sprint</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="brand"><span class="brand-mark">ΔH</span><span>Sprint</span></header>

    <section id="setupScreen" class="screen setup-screen" aria-labelledby="setupTitle">
      <div class="intro">
        <p class="eyebrow">반응 엔탈피 계산 훈련</p>
        <h1 id="setupTitle">빠르고 정확하게.</h1>
        <p>연습할 유형과 속도를 고르면 바로 시작합니다.</p>
      </div>

      <div class="settings-card">
        <fieldset>
          <legend>연습 모드</legend>
          <div class="option-grid modes" id="modeOptions">
            <button class="option active" data-mode="decimal"><b>소수 덧셈·뺄셈</b><span>세 자리 수 · 소수 한 자리</span></button>
            <button class="option" data-mode="multiply"><b>한 자리 곱셈</b><span>엔탈피 계수배 준비</span></button>
            <button class="option" data-mode="mixed"><b>혼합 계산</b><span>덧셈·뺄셈·곱셈</span></button>
            <button class="option" data-mode="hess"><b>헤스 법칙</b><span>40개 대표 유형 문제</span></button>
          </div>
        </fieldset>

        <fieldset>
          <legend>문제 수</legend>
          <div class="segmented" id="countOptions">
            <button data-count="10">10</button><button class="active" data-count="20">20</button><button data-count="30">30</button><button data-count="40">40</button><button data-count="50">50</button>
          </div>
        </fieldset>

        <fieldset>
          <div class="legend-row"><legend>속도</legend><span id="tempoHint">기본보다 조금 여유롭게 · 1.15×</span></div>
          <div class="tempo-list" id="tempoOptions">
            <button data-tempo="largo"><span>Largo</span><small>1.60×</small></button>
            <button data-tempo="adagio"><span>Adagio</span><small>1.35×</small></button>
            <button class="active" data-tempo="andante"><span>Andante</span><small>1.15×</small></button>
            <button data-tempo="allegro"><span>Allegro</span><small>0.90×</small></button>
            <button data-tempo="presto"><span>Presto</span><small>0.70×</small></button>
          </div>
        </fieldset>

        <div class="estimate"><span>예상 제한 시간</span><strong id="timeEstimate">4분 36초</strong></div>
        <button id="startButton" class="primary">연습 시작 <span>→</span></button>
      </div>
    </section>

    <section id="quizScreen" class="screen quiz-screen hidden" aria-live="polite">
      <div class="quiz-topbar">
        <button id="quitButton" class="icon-button" aria-label="연습 종료">×</button>
        <div class="progress-track"><div id="progressBar"></div></div>
        <span id="progressText">1 / 20</span>
      </div>

      <div class="score-strip">
        <div><span>점수</span><strong id="scoreText">0</strong></div>
        <div><span>콤보</span><strong id="comboText">0</strong></div>
        <div><span>전체 정답</span><strong id="correctText">0 / 0</strong></div>
        <div class="timer"><span>남은 시간</span><strong id="timerText">00:12</strong></div>
      </div>

      <article class="question-card">
        <div class="question-meta"><span id="modeLabel">소수 덧셈·뺄셈</span><span id="tempoLabel">Andante</span></div>
        <div id="questionContent" class="question-content"></div>
        <label class="answer-label" for="answerInput">답</label>
        <div class="answer-row">
          <input id="answerInput" type="text" inputmode="decimal" autocomplete="off" aria-label="정답 입력" placeholder="0.0" />
          <span id="answerUnit" class="unit"></span>
          <button id="submitButton" class="submit">제출</button>
        </div>
        <p id="feedback" class="feedback" aria-live="assertive"></p>
      </article>

      <div id="mobileKeypad" class="keypad" aria-label="숫자 키패드">
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="-">−</button><button data-key="0">0</button><button data-key=".">.</button>
        <button class="wide" data-key="backspace">지우기</button><button class="wide key-submit" data-key="submit">제출</button>
      </div>
      <p class="keyboard-hint">숫자 입력 · Enter 제출 · Backspace 지우기</p>
    </section>

    <section id="resultScreen" class="screen result-screen hidden" aria-labelledby="resultTitle">
      <p class="eyebrow">연습 완료</p>
      <h1 id="resultTitle">수고했어요.</h1>
      <div class="final-score"><span>최종 점수</span><strong id="finalScore">0</strong></div>
      <div class="result-grid">
        <div><span>정답</span><strong id="finalCorrect">0 / 20</strong></div>
        <div><span>정답률</span><strong id="finalAccuracy">0%</strong></div>
        <div><span>최고 콤보</span><strong id="finalCombo">0</strong></div>
        <div><span>총 소요 시간</span><strong id="finalTime">00:00</strong></div>
      </div>
      <div id="reviewBox" class="review-box hidden">
        <div class="review-head"><h2>오답 다시 보기</h2><span id="reviewCount"></span></div>
        <div id="reviewList"></div>
      </div>
      <div class="result-actions"><button id="retryButton" class="primary">같은 설정으로 다시</button><button id="homeButton" class="secondary">설정으로</button></div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
